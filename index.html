    <script>
      // Early capture of PWA beforeinstallprompt
      window.deferredInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.deferredInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-ready', { detail: e }));
      });
      window.addEventListener('appinstalled', function() {
        window.deferredInstallPrompt = null;
        window.dispatchEvent(new CustomEvent('pwa-installed'));
      });
    </script>
    <script>
      (function() {
        if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.search.includes('debug=true')) return;
        // Immediate right-click context menu blocking
        document.addEventListener('contextmenu', function(e) {
          e.preventDefault();
        }, true);
        // Immediate F12 and devtool shortcuts blocking
        document.addEventListener('keydown', function(e) {
          if (e.key === 'F12' || e.keyCode === 123) {
            e.preventDefault();
          }
          if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) {
            e.preventDefault();
          }
          if ((e.ctrlKey || e.metaKey) && (e.key === 'u' || e.key === 'U')) {
            e.preventDefault();
          }
        }, true);
      })();
    </script>
